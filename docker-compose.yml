services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: routing
      POSTGRES_USER: routing
      POSTGRES_PASSWORD: routing
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgres://routing:routing@db:5432/routing
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  pgdata:
